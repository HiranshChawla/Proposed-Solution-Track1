<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanScan AI</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="flex h-screen w-screen overflow-hidden text-sm">

  <div id="toast">Message</div>

  <!-- SIDEBAR -->
  <aside class="w-64 glass-panel border-r border-glass-border flex flex-col z-20 shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-glass-border">
      <i class="fa-solid fa-satellite-dish text-blue-500 text-xl mr-3"></i>
      <h1 class="font-bold text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
        UrbanScan <span class="text-white font-light">AI</span>
      </h1>
    </div>

    <div class="px-6 py-4 border-b border-glass-border flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        <span class="text-xs font-mono text-gray-400 uppercase tracking-widest">Sys Online</span>
      </div>
      <span id="sys-clock" class="text-xs font-mono text-blue-400">00:00:00</span>
    </div>

    <nav class="flex-1 py-4 flex flex-col gap-1 px-3">
      <button onclick="switchTab('scanner')" id="tab-scanner"
        class="nav-item active flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:text-white transition-colors w-full text-left">
        <i class="fa-solid fa-expand w-5 text-center"></i>
        <span class="font-medium">Vision Scanner</span>
      </button>

      <button onclick="switchTab('inventory')" id="tab-inventory"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:text-white transition-colors w-full text-left">
        <i class="fa-solid fa-database w-5 text-center"></i>
        <span class="font-medium">Asset Inventory</span>
      </button>

      <button onclick="switchTab('map')" id="tab-map"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:text-white transition-colors w-full text-left">
        <i class="fa-solid fa-map-location-dot w-5 text-center"></i>
        <span class="font-medium">GIS Overview</span>
      </button>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 relative flex flex-col z-10 h-full overflow-hidden p-6 gap-6">

    <!-- SCANNER -->
    <section id="pane-scanner" class="section-pane active flex-col h-full gap-6">

      <div class="flex justify-between items-end">
        <div>
          <h2 class="text-2xl font-bold text-white mb-1">
            Autonomous Asset Digitization
          </h2>

          <p class="text-gray-400 mb-3">
            Upload imagery and filter detected elements.
          </p>

          <div class="flex gap-2" id="global-filters">
            <button onclick="setFilter('All')" class="filter-btn active bg-blue-500/20 text-blue-300">All</button>
            <button onclick="setFilter('Property')" class="filter-btn">Property</button>
            <button onclick="setFilter('Roads/Footpaths')" class="filter-btn">Roads</button>
            <button onclick="setFilter('Open Parks')" class="filter-btn">Parks</button>
            <button onclick="setFilter('Water Bodies')" class="filter-btn">Water</button>
          </div>
        </div>

        <div class="flex gap-3">
          <button id="btn-clear" onclick="clearImage()"
            class="px-4 py-2 rounded-lg border border-red-500/30 text-red-400 hover:bg-red-500/10 hidden transition-colors">
            <i class="fa-solid fa-trash-can mr-2"></i>Clear
          </button>

          <button id="btn-run" onclick="runAIScan()" disabled
            class="glass-button px-6 py-2 rounded-lg font-semibold text-white shadow-lg flex items-center">
            <i class="fa-solid fa-microchip mr-2"></i> Run AI
          </button>
        </div>
      </div>

      <div class="flex flex-1 gap-6 min-h-0">

        <!-- CANVAS -->
        <div class="flex-[2] glass-panel rounded-xl flex flex-col p-2 relative">

          <div id="upload-state"
            class="absolute inset-0 m-4 border-2 border-dashed border-white/20 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-500/10 transition-all z-20"
            onclick="document.getElementById('file-input').click()">

            <div class="w-16 h-16 rounded-full bg-blue-500/20 flex items-center justify-center mb-4 text-blue-400">
              <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
            </div>

            <h3 class="text-lg font-semibold text-white mb-2">
              Upload Image
            </h3>

            <input type="file" id="file-input" class="hidden" accept="image/*"
              onchange="handleFileSelect(event)">
          </div>

          <div id="canvas-container"
            class="hidden w-full h-full bg-black/40 flex items-center justify-center relative">
            <div class="scan-line"></div>
            <canvas id="main-canvas"></canvas>
          </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="flex-1 flex flex-col gap-4 min-h-0">

          <div class="glass-panel rounded-xl p-5 flex flex-col">
            <h3 class="font-semibold text-gray-200 mb-4">
              Asset Summary
            </h3>

            <div class="flex-1 relative min-h-[180px]">
              <canvas id="stats-chart"></canvas>
            </div>
          </div>

          <div class="glass-panel rounded-xl p-5 flex-1 overflow-y-auto">
            <h3 class="font-semibold text-gray-200 mb-3">
              Logs
            </h3>

            <div id="terminal-logs"
              class="font-mono text-xs text-gray-400 flex flex-col gap-2">
              <div class="text-blue-400">
                > System initialized
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- INVENTORY -->
    <section id="pane-inventory" class="section-pane flex-col h-full gap-6">

      <div>
        <h2 class="text-2xl font-bold text-white mb-1">
          Asset Inventory
        </h2>
      </div>

      <div class="flex-1 glass-panel rounded-xl overflow-hidden flex flex-col">
        <div class="overflow-y-auto flex-1 p-0">

          <table class="w-full text-left">
            <thead class="text-xs uppercase text-gray-400 bg-black/20">
              <tr>
                <th class="px-6 py-4">ID</th>
                <th class="px-6 py-4">Class</th>
                <th class="px-6 py-4">Confidence</th>
                <th class="px-6 py-4">Coords</th>
              </tr>
            </thead>

            <tbody id="inventory-body" class="divide-y divide-glass-border text-gray-300">
              <tr>
                <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                  No assets detected.
                </td>
              </tr>
            </tbody>

          </table>
        </div>
      </div>
    </section>

    <!-- MAP -->
    <section id="pane-map" class="section-pane flex-col h-full gap-6">

      <div>
        <h2 class="text-2xl font-bold text-white mb-1">
          GIS Overview
        </h2>
      </div>

      <div class="flex-1 glass-panel rounded-xl p-2 relative">
        <div id="leaflet-map" class="w-full h-full rounded-lg bg-gray-900 z-0"></div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
